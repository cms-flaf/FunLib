key: WhittakerW
label: Whittaker W (Whittaker equation)
description: |
  **Whittaker W functions** (**E.T. Whittaker**, 1903) are solutions of the Whittaker differential equation, a standard form of the confluent hypergeometric equation.
  Special cases include: **Bessel functions**, **parabolic cylinder functions**, **incomplete Gamma functions**, and **Coulomb wave functions** used in nuclear and atomic scattering.

  The two continuous indices (κ, μ) span an enormous space of tail shapes, making this **among the most general two-parameter analytic families** available.
latex: f(x)=W_{\kappa,\mu}(a\,x)=e^{-a\,x/2}(a\,x)^{\mu+1/2}U(\mu-\kappa+\tfrac12,1+2\mu,a\,x)
reference: https://en.wikipedia.org/wiki/Whittaker_function
param_names:
- kappa
- mu
- a
constants:
  z_hi: 500.0       # W negligible and may overflow for z > z_hi
  kappa_lo: -10.0   # hyperu slow/divergent for kappa outside these bounds — clamp
  kappa_hi: 10.0
  mu_lo: -0.49      # mu < -0.5 makes z^(mu+0.5) complex — clamp
  mu_hi: 10.0
validate_params:
- -2.0
- 2.0
- 1.83336e-05
minimization:
  max_function_calls: 5000
