key: "BWZxBern-{npar-1}"
label: "BWZ × Bernstein-{npar-1}"
description: |
  The Breit-Wigner Z kernel for the Z lineshape.
  The exponential factor e^{ax} absorbs the steeply falling DY continuum
  (QCD K-factor slope).
  Remaining shape effects handled by the Berstein polinomials of degree n.

latex:
- when: {is_running: true}
  formula: 'f(x)=\dfrac{e^{a\,x}\,x^{2}\!\left[(1-t)^{n}+\sum_{k=1}^{n}\binom{n}{k}c_{k}\,t^{k}(1-t)^{n-k}\right]}{(x^{2}-M_{Z}^{2})^{2}+(M_{Z}\,G_{Z})^{2}},\ \ t=\dfrac{x-x_{\min}}{x_{\max}-x_{\min}}'
- when: {}
  formula: 'f(x)=\dfrac{e^{a\,x}\!\left[(1-t)^{n}+\sum_{k=1}^{n}\binom{n}{k}c_{k}\,t^{k}(1-t)^{n-k}\right]}{(x^{2}-M_{Z}^{2})^{2}+(M_{Z}\,G_{Z})^{2}},\ \ t=\dfrac{x-x_{\min}}{x_{\max}-x_{\min}}'
reference: https://arxiv.org/abs/2009.04363
latex_var_map:
  MZ: "m"
  GZ: "Gamma"
  n: n_terms
# npar and param_names are intentionally absent: variable-npar kernel.
# n_terms constant (set per entry in all_functions.yaml) is the Bernstein degree;
# npar = n_terms + 1 (n_terms Bernstein coeffs + exponential slope a).
constants:
  m: 91.1876
  Gamma: 2.4952
  exp_max: 700.0  # upper clamp for a*x before exp()
